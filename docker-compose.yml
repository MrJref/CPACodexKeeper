services:
  cpacodexkeeper:
    build: .
    container_name: cpacodexkeeper
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    volumes:
      - ./config.yml:/app/config.yml
    environment:
      CPA_ENDPOINT: ${CPA_ENDPOINT}
      CPA_TOKEN: ${CPA_TOKEN}
      CPA_PROXY: ${CPA_PROXY:-}
      CPA_INTERVAL: ${CPA_INTERVAL:-1800}
      CPA_QUOTA_THRESHOLD: ${CPA_QUOTA_THRESHOLD:-1}
      CPA_EXPIRY_THRESHOLD_DAYS: ${CPA_EXPIRY_THRESHOLD_DAYS:-3}
      CPA_ENABLE_REFRESH: ${CPA_ENABLE_REFRESH:-true}
      CPA_HTTP_TIMEOUT: ${CPA_HTTP_TIMEOUT:-30}
      CPA_USAGE_TIMEOUT: ${CPA_USAGE_TIMEOUT:-15}
      CPA_MAX_RETRIES: ${CPA_MAX_RETRIES:-2}
      CPA_WORKER_THREADS: ${CPA_WORKER_THREADS:-8}
      WEBUI_ENABLED: ${WEBUI_ENABLED:-true}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8080}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:-}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-168h}
      LOG_MAX_LINES: ${LOG_MAX_LINES:-500}
